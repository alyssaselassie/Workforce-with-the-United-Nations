<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Take the Survey · UN Workforce Experience Survey</title>
  <meta name="description" content="An anonymous, multiple-choice survey on psychological safety, inclusion, cross-cultural collaboration, leadership, bias in workplace practices and organizational support.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
  <link href="survey.css?v=20261116w" rel="stylesheet">
</head>
<body>
  <a class="sv-skip" href="#sv-main">Skip to the survey</a>
  <aside class="sv-preview-bar" aria-label="Prototype notice">
    <div class="sv-wrap"><p class="sv-preview-note"><strong>Website prototype:</strong> answers are saved only in this browser, on this device, and are not sent to any server. <a href="./">Results dashboard</a></p></div>
  </aside>

  <header class="sv-top">
    <div class="sv-wrap">
      <div class="sv-top-row">
        <p class="sv-brand">UN Workforce Experience Survey</p>
        <p class="sv-count" id="sv-count" aria-live="polite"></p>
      </div>
      <div class="sv-progress" id="sv-progress" role="progressbar" aria-label="Questions answered" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
    </div>
  </header>

  <main id="sv-main" class="sv-wrap">
    <form id="sv-form" class="sv-card" novalidate>
      <div id="sv-errors" class="sv-error-summary" tabindex="-1" hidden></div>
      <div id="sv-page"></div>
      <div class="sv-nav" id="sv-nav">
        <button type="button" class="sv-btn sv-back" id="sv-back">Back</button>
        <button type="submit" class="sv-btn sv-next" id="sv-next">Next</button>
      </div>
    </form>
    <p class="sv-foot">An independent educational prototype. Not an official United Nations product.</p>
  </main>

  <script src="workforce-survey.js?v=20261116w"></script>
  <script src="survey.js?v=20261116w"></script>
</body>
</html>
