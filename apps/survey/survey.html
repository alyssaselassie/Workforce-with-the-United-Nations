<body>
  <a class="as-skip" href="#sv-main">Skip to the survey</a>
  <header class="as-header">
    <div class="as-wrap">
      <a class="as-brand" href="index.html">
        <span class="as-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5V3h6v1.5"/><path d="M8.5 12.5l2.2 2.2 4.8-4.8"/></svg></span>
        <span class="as-brand-text"><small>Anonymous survey</small>Workplace Relief Map Survey</span>

      <nav class="as-nav" aria-label="Survey">
        <ul>
          <li><a href="index.html">About</a></li>

      <div class="sv-top-row">
        <p class="sv-brand">Your progress</p>
        <p class="sv-count" id="sv-count" aria-live="polite"></p>

  <main id="sv-main" class="as-wrap as-narrow sv-main">
    <form id="sv-form" class="sv-card" novalidate>
      <div id="sv-errors" class="sv-error-summary" tabindex="-1" hidden></div>
      <div id="sv-page"></div>
      <div class="sv-nav" id="sv-nav">
        <button type="button" class="sv-btn sv-back" id="sv-back">Back</button>
        <button type="submit" class="sv-btn sv-next" id="sv-next">Next</button>
