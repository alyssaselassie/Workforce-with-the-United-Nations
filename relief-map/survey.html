<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Survey Preview · Relief Maps</title>
  <meta name="description" content="A preview of the Relief Maps workplace experience survey, as it will look in Qualtrics on a phone. Answers are not saved.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
  <link href="survey.css?v=20261115u" rel="stylesheet">
</head>
<body>
  <a class="sv-skip" href="#sv-main">Skip to the survey</a>
  <div class="sv-preview-bar">
    <div class="sv-wrap"><p class="sv-preview-note"><strong>Preview:</strong> answers are not saved. <a href="./">Back to the map</a></p></div>
  </div>

  <header class="sv-top">
    <div class="sv-wrap">
      <p class="sv-brand">Relief Maps</p>
      <div class="sv-progress" id="sv-progress" role="progressbar" aria-label="Survey progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
    </div>
  </header>

  <main id="sv-main" class="sv-wrap">
    <form id="sv-form" class="sv-card" novalidate>
      <div id="sv-page"></div>
      <p class="sv-error" id="sv-error" role="alert" hidden></p>
      <div class="sv-nav" id="sv-nav">
        <button type="button" class="sv-btn sv-back" id="sv-back">Back</button>
        <button type="submit" class="sv-btn sv-next" id="sv-next">Next</button>
      </div>
    </form>
    <p class="sv-foot">Prototype for the UN Transformative Spaces initiative; not an official United Nations product.</p>
  </main>

  <script src="relief-map.js?v=20261115u"></script>
  <script src="survey.js?v=20261115u"></script>
</body>
</html>
