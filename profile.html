<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile · CQ &amp; Bias Navigator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="styles.css?v=20261025d" rel="stylesheet">
</head>
<body data-page="profile">
  <header id="site-header"></header>

  <main id="main">
    <div class="container-xl pt-4 no-print"><div data-tip="Customize your field agent any time. New gear unlocks as you level up."></div></div>
    <div class="container-xl py-4" id="profile-root" aria-live="polite">
      <p class="text-muted-2">Loading…</p>
    </div>

    <!-- Edit profile -->
    <div class="modal fade" id="edit-modal" tabindex="-1" aria-labelledby="edit-title" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <form class="modal-content" id="edit-form">
          <div class="modal-header">
            <h2 class="modal-title h5" id="edit-title">Edit profile</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p class="form-label fw-semibold mb-1">Banner photo</p>
            <div id="cover-preview" class="cover-preview mb-2" role="img" aria-label="Banner photo preview"></div>
            <div class="d-flex flex-wrap align-items-center gap-2 mb-4">
              <label class="btn btn-outline-primary btn-sm mb-0">
                <i class="bi bi-image" aria-hidden="true"></i> Upload banner
                <input type="file" id="cover-input" accept="image/*" class="file-input">
              </label>
              <button type="button" class="btn btn-outline-secondary btn-sm" id="cover-remove">Remove</button>
              <span class="small text-muted-2" id="cover-msg"></span>
            </div>
            <p class="form-label fw-semibold mb-1">Profile photo</p>
            <div class="d-flex align-items-center gap-3 mb-4">
              <div id="photo-preview"></div>
              <div>
                <label class="btn btn-outline-primary btn-sm mb-0">
                  <i class="bi bi-camera" aria-hidden="true"></i> Upload photo
                  <input type="file" id="photo-input" accept="image/*" class="file-input">
                </label>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="photo-remove">Remove</button>
                <p class="small text-muted-2 mb-0 mt-1" id="photo-msg">JPG, PNG or WebP. It's cropped to a square.</p>
              </div>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold" for="pf-name">Full name</label>
                <input class="form-control" id="pf-name" maxlength="80" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold" for="pf-headline">Headline</label>
                <input class="form-control" id="pf-headline" maxlength="120" placeholder="e.g. Civil Affairs Officer · MPA candidate, NYU">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold" for="pf-mission">Duty station or mission of interest</label>
                <select class="form-select" id="pf-mission"><option value="">None selected</option></select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold" for="pf-location">Location</label>
                <input class="form-control" id="pf-location" maxlength="80" placeholder="e.g. New York, USA">
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold" for="pf-languages">Languages</label>
                <input class="form-control" id="pf-languages" maxlength="160" placeholder="Separate with commas, e.g. English, French, Swahili">
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold" for="pf-about">About</label>
                <textarea class="form-control" id="pf-about" rows="3" maxlength="800" placeholder="Your background and the field experience you bring."></textarea>
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold" for="pf-goal">Learning goal</label>
                <input class="form-control" id="pf-goal" maxlength="200" placeholder="e.g. Run more inclusive community consultations">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save profile</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="data/data-bundle.js?v=20261025d"></script>
  <script src="script.js?v=20261025d"></script>
  <script src="js/game.js?v=20261025d"></script>
  <script src="js/avatar.js?v=20261025d"></script>
  <script src="js/scenes.js?v=20261025d"></script>
  <script src="js/profile.js?v=20261025d"></script>
</body>
</html>
